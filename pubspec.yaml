name: my_trainning_path
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.12.1
  shared_preferences: ^2.5.5
  firebase_auth: ^6.5.6
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: GrindAndDeath
      fonts:
        - asset: assets/fonts/grindAndDeath_Demo.ttf
          weight: 700