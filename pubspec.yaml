name: my_trainning_path
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.12.1
  shared_preferences: ^2.5.5
  firebase_auth: ^6.5.6
  provider: ^6.1.5+1
  google_sign_in: ^7.2.0
  flutter_launcher_icons: ^0.14.4
  flutter_localizations:
    sdk: flutter
  intl: any


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/

  fonts:
    - family: GrindAndDeath
      fonts:
        - asset: assets/fonts/grindAndDeath_Demo.ttf
          weight: 700

flutter_launcher_icons:
  android: true 
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
